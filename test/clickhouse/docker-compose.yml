# ClickHouse with drex-clickhouse's functions, built from a checkout of nace-ai/drex-clickhouse at its release, and the
# mock Drex API in ClickHouse's network, so the functions reach it at http://127.0.0.1:8787. From the repository root:
#
#   git clone --branch v0.1.2 https://github.com/nace-ai/drex-clickhouse.git .drex-clickhouse
#   python3 test/clickhouse/functions.py .drex-clickhouse/config/drex_function.xml \
#       http://127.0.0.1:8787/ns/clickhouse/ok test/.generated/drex_function.xml
#   DREX_CLICKHOUSE_SOURCE=.drex-clickhouse docker compose -f test/clickhouse/docker-compose.yml up -d --build --wait
#
# For the live API, leave out the mock (`up -d --build --wait clickhouse`), write the config with
# https://console.nace.ai, and put the key in nace_api_key beside it, in a directory named by DREX_CLICKHOUSE_GENERATED
# (an absolute path; test/.generated by default).
name: dbt-drex-clickhouse
services:
  clickhouse:
    build:
      context: ${DREX_CLICKHOUSE_SOURCE:?the drex-clickhouse checkout}
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${DREX_CLICKHOUSE_PORT:-18123}:8123"
      - "127.0.0.1:${DREX_CLICKHOUSE_MOCK_PORT:-18788}:8787"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ${DREX_CLICKHOUSE_GENERATED:-../.generated}/nace_api_key:/etc/clickhouse-server/drex/nace_api_key:ro
      - ${DREX_CLICKHOUSE_GENERATED:-../.generated}/drex_function.xml:/etc/clickhouse-server/drex_function.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  mock:
    image: python:3.12-slim
    network_mode: "service:clickhouse"
    volumes:
      - ../mock:/mock:ro
    command: ["python3", "/mock/drex_mock.py", "--host", "0.0.0.0", "--port", "8787"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/__health')"]
      interval: 2s
      timeout: 5s
      retries: 30
